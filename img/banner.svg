<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2638" />
      <stop offset="100%" stop-color="#0E131F" />
    </linearGradient>

    <!-- Emerald Active Page Glow -->
    <linearGradient id="pageGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#11998E" />
    </linearGradient>

    <!-- Metallic Mint Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#9AE6B4" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Banner Background (Rounded Rectangle) -->
  <rect width="800" height="250" rx="32" fill="url(#bg)" stroke="#2B364C" stroke-width="2" />

  <!-- Centered Lockup (Icon + Text) -->
  <g transform="translate(190, 0)">
    
    <!-- Book Glyph -->
    <g transform="translate(0, 55) scale(1.4)" filter="url(#shadow)">
      <path d="M 18 20 C 33 20, 44 24, 48 29 L 48 77 C 44 73, 32 69, 18 69 Z" fill="#E2E8F0" />
      <path d="M 78 20 C 63 20, 52 24, 48 29 L 48 77 C 52 73, 64 69, 78 69 Z" fill="url(#pageGlow)" />
      <line x1="48" y1="29" x2="48" y2="77" stroke="#0E131F" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="48" cy="91" r="3.8" fill="#38EF7D" />
    </g>

    <!-- Single Title -->
    <text x="140" y="152"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" 
          font-size="88" 
          font-weight="800" 
          letter-spacing="-1.5" 
          fill="url(#textGrad)">NanoPDF</text>
  </g>
</svg>
